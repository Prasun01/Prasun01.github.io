        <h1>Prasun Mishra — Visual Poetry Archive</h1>
        <p>I'm Prasun Mishra, a photographer based in India. I'm drawn to the quiet geometry of the built world — the lines, rhythms, and stillness hiding inside everyday cityscapes.</p>
        <p>My work lives in architecture and urban minimalism: clean frames, strong structure, nothing extra. I shoot with a Nikon D3400, mostly wandering cities and waiting for the moment a building, a shadow, or an empty space arranges itself into something worth keeping.</p>
        <p>Explore works on <a href="https://unsplash.com/@prasunmishra1">Unsplash</a>, follow on <a href="https://www.instagram.com/shotbyprasun">Instagram (@shotbyprasun)</a> or <a href="https://x.com/prasunmishra0">X / Twitter (@prasunmishra0)</a>, and view code on <a href="https://github.com/Prasun01">GitHub</a>.</p>
